
name: CI

env:
  APP_NAME: fastapi-starter

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint – Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier le style
        run: ruff check .

      - name: Display contexts
        run: |
            echo "Application: ${{ env.APP_NAME }}"
            echo "Actor: ${{ github.actor }}"
            echo "Event: ${{ github.event_name }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit SHA: ${{ github.sha }}"
            echo "Runner OS: ${{ runner.os }}"

      - name: Display PR contexts
        run: |
            echo "Event: ${{ github.event_name }}"
            echo "Head branch: ${{ github.head_ref }}"
            echo "Base branch: ${{ github.base_ref }}"

  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest
